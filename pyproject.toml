[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chaoxing-cli"
version = "0.1.0"
description = "学习通个人空间 API 研究客户端"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12,<5", "requests>=2.32,<3", "pyaes>=1.6.1,<2"]

[project.scripts]
chaoxing-cli = "chaoxing_cli:main"

[tool.setuptools]
packages = ["chaoxing"]
py-modules = ["chaoxing_cli"]
